name: pasir_silika
description: "A new Flutter project."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.12.0

dependencies:
  connectivity_plus: ^7.3.2
  decimal: ^3.2.6
  dio: ^5.11.1
  drift: ^2.35.4
  esc_pos_utils_plus: ^2.0.4
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^17.5.0
  image: ^4.13.1
  image_picker: ^1.2.4
  intl: ^0.20.2
  local_auth: ^3.0.2
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  permission_handler: ^12.0.1
  print_bluetooth_thermal: ^1.2.5
  printing: ^5.15.1
  sqlite3: ^3.5.2
  uuid: ^4.6.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# Database lokal dienkripsi dengan SQLCipher (PRD 6 — Keamanan).
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

# Ikon aplikasi — generate ulang: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/icon_legacy.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  min_sdk_android: 26
